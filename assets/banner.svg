<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)" opacity="0.5"/>

  <!-- one-way boundary line -->
  <line x1="0" y1="130" x2="1200" y2="130" stroke="url(#accent)" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <polygon points="560,124 580,130 560,136" fill="#38bdf8" opacity="0.8"/>
  <polygon points="480,124 500,130 480,136" fill="#38bdf8" opacity="0.6"/>
  <polygon points="400,124 420,130 400,136" fill="#38bdf8" opacity="0.4"/>

  <!-- shield icon -->
  <g transform="translate(90,70)">
    <path d="M60 0 L115 22 V70 C115 105 92 128 60 140 C28 128 5 105 5 70 V22 Z"
          fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M40 68 L55 83 L82 50" fill="none" stroke="url(#accent)" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- text -->
  <text x="245" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64"
        font-weight="700" fill="#f8fafc" letter-spacing="2">SAMARP</text>
  <text x="248" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21"
        fill="#94a3b8">AI-Based Detection of Cyber Threats in Unidirectional IP Traffic</text>
  <text x="248" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16"
        fill="#64748b">Smart India Hackathon 2026 &#8212; Problem Statement PS26145 (NTRO)</text>

  <!-- small labels either side of the boundary -->
  <text x="90" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14"
        fill="#64748b" letter-spacing="1">MONITORED ENCLAVE</text>
  <text x="960" y="235" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14"
        fill="#64748b" letter-spacing="1" text-anchor="end">READ-ONLY OUTPUT</text>
</svg>
